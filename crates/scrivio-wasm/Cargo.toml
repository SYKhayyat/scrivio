[package]
name = "scrivio-wasm"
version = "0.1.0"
edition = "2021"
description = "Scrivio WASM — reflow, segmentation, crop (Rust → WASM)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imageproc = "0.25"

[dependencies.web-sys]
version = "0.3"
features = []

[profile.release]
opt-level = 3
lto = true
